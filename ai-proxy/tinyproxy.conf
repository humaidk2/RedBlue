# ─────────────────────────────────────────────────────────────────────────────
# tinyproxy — external egress allowlist for the ApkScope harness.
#
# Default-deny: a destination host is reachable ONLY if it matches a pattern in
# /etc/tinyproxy/filter. With the default (empty) filter nothing is reachable —
# a fully air-gapped run. The local LLM is NOT reached through here; it has its
# own single-purpose route (llm-gateway), and validate.sh refuses any filter
# line that points at the host, localhost, a private range, or a raw IP.
# ─────────────────────────────────────────────────────────────────────────────

# Drop privileges after binding the port.
User  tinyproxy
Group tinyproxy

# Listens on the internal `sealed` network (internal: true), so nothing outside
# Docker can reach this port.
Port   8888
Listen 0.0.0.0
Timeout 600

LogLevel Info
MaxClients 50

# ── Allowlist ────────────────────────────────────────────────────────────────
# Applied to the destination host of both plain requests and CONNECT tunnels;
# anything not listed is refused (HTTP 403) before a connection is made.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterCaseSensitive Off

# Only HTTPS CONNECT tunnels to 443. No odd ports.
ConnectPort 443

# Any client on the internal network may use the proxy (only the harness is
# attached besides the gateway).
Allow 0.0.0.0/0
